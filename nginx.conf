server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
  location = /robots.txt { default_type text/plain; try_files $uri =404; }
  location = /app.html { try_files $uri =404; }
  location /assets/ { try_files $uri =404; }
  # Recover links made by the previous selector, which used the Arabic label
  # as a URL instead of the public /ar/ locale code.
  location ~ ^/العربية/(.*)$ { return 301 /ar/$1; }
  location = / { try_files /app.html =404; }
  # Public locale roots are first-class routes so crawlers and visitors receive
  # the same application shell at /fr/, /de/, /ar/, /es/, /cn/ and /nl/.
  location ~ ^/(?:ar|fr|es|de|cn|nl)/?$ { try_files /app.html =404; }
  location ~ ^/(?:ar|fr|es|de|cn|nl)/(?:pricing|reseller|apps|guides|blog|contact|about|privacy|refund|terms)/?$ { try_files /app.html =404; }
  location ~ ^/(?:pricing|reseller|apps|guides|blog|contact|about|privacy|refund|terms)/?$ { try_files /app.html =404; }
  location / { try_files $uri =404; }
  error_page 404 /not-found.html;
  location = /not-found.html { internal; }
  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
